name: Bug report
description: Something behaves incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here — see
        [SECURITY.md](../../SECURITY.md) for the private reporting process.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the repository state (conflicted merge, detached HEAD, multi-root, etc.).
      placeholder: |
        1. Open a repository with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: GitView version
    validations:
      required: true
  - type: input
    id: vscode-version
    attributes:
      label: VS Code version
      description: Help → About (or Code → About Visual Studio Code)
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, Other]
    validations:
      required: true
  - type: input
    id: git-version
    attributes:
      label: Git version
      description: Output of `git --version`
  - type: textarea
    id: logs
    attributes:
      label: Output channel logs
      description: |
        View → Output → "GitView". Redact repository names, paths and tokens.
      render: text
